name: Athletes First
description: 'Athletes First is a full-service sports representation and management
  agency founded in 2001 and headquartered in Southern California, with additional
  offices in New York City, Gainesville, Austin, and Atlanta. The firm represents
  elite NFL players, coaches, front-office executives, collegiate athletes, and sports
  broadcasters, and operates specialized departments spanning football contract negotiation,
  career management, pre-draft preparation, talent marketing and brand building, broadcasting
  and new media, media development and sales, and properties and events. In February
  2023, Mastry Ventures in partnership with General Catalyst acquired a majority stake
  in the agency. This profile was surfaced as a General Catalyst portfolio company
  (sector: consumer) and added to the API Evangelist network. Athletes First publishes
  no public developer, API, or technical surface.'
